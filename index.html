
<!DOCTYPE html>
<html lang="th">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HOGWORLDS PATHFINDER</title>

    <meta name="description"
          content="แผนที่เดินทางของ Danny ที่จะพาคุณไปเรียนได้ถูกทาง">

    <meta property="og:title"
          content="HOGWORLDS PATHFINDER">

    <meta property="og:description"
          content="แผนที่เดินทางของ Danny ที่จะพาคุณไปเรียนได้ถูกทาง">

    <meta property="og:url"
          content="https://dannyfawley.github.io/hogworlds/">

    <meta property="og:type"
          content="website">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="crest">✦</div>

        <h1>HOGWORLDS</h1>

        <div class="subtitle">
            P A T H F I N D E R
        </div>

        <p>แผนที่เดินทางของ DANNY</p>

    </header>


    <main>

        <!-- หน้าหลัก -->

        <section id="home">

            <h2>เลือกจุดหมายปลายทาง</h2>

            <p class="description">
                เลือกสถานที่ที่คุณต้องการเดินทางไป
            </p>


            <!-- ระบบสลับหมวดหมู่ -->

            <div class="category-tabs">

                <button
                    id="classroomTab"
                    class="tab-button active"
                    onclick="selectCategory('classroom')"
                    aria-pressed="true">

                    📖 ห้องเรียน
                    <small>CLASSROOMS</small>

                </button>


                <button
                    id="locationTab"
                    class="tab-button"
                    onclick="selectCategory('location')"
                    aria-pressed="false">

                    📍 สถานที่ทั่วไป
                    <small>LOCATIONS</small>

                </button>


                <!-- TAB รายการโปรด -->

                <button
                    id="favoritesTab"
                    class="tab-button"
                    onclick="selectCategory('favorites')"
                    aria-pressed="false">

                    ★ รายการโปรด
                    <small>FAVORITES</small>

                </button>

            </div>


            <!-- การ์ดสถานที่ -->

            <div class="room-grid" id="roomGrid">
            </div>


            <!-- เมื่อยังไม่มีรายการโปรด -->

            <div id="emptyFavorites"
                 class="empty-favorites"
                 hidden>

                <div class="empty-star">☆</div>

                <h2>ยังไม่มีรายการโปรด</h2>

                <p>
                    กดดาวที่สถานที่ที่คุณเดินทางไปบ่อย
                    เพื่อบันทึกไว้ที่นี่
                </p>

                <button
                    class="home-button"
                    onclick="selectCategory('classroom')">

                    เลือกสถานที่

                </button>

            </div>

        </section>


        <!-- หน้านำทาง -->

        <section id="navigation" hidden>

            <button class="home-button"
                    onclick="goHome()">

                ← กลับหน้าหลัก

            </button>


            <h2 id="roomName"></h2>

            <p id="roomEnglish"></p>


            <div class="progress-info">

                <span id="stepCounter"></span>
                <span id="percentage"></span>

            </div>


            <div class="progress-track">
                <div id="progressBar"></div>
            </div>


            <div class="image-frame">

                <img id="routeImage"
                     alt="ภาพเส้นทางจากในเกม">

            </div>


            <p id="instruction"></p>


            <div class="navigation-buttons">

                <button id="prevButton"
                        onclick="previousStep()">

                    ← ย้อนกลับ

                </button>


                <button id="nextButton"
                        onclick="nextStep()">

                    เดินทางต่อ →

                </button>

            </div>


            <button class="restart-button"
                    onclick="restartRoute()">

                ↻ เริ่มเส้นทางใหม่

            </button>

        </section>

    </main>


    <footer>

        <p>✦ HOGWORLDS PATHFINDER ✦</p>

        <small>
            Interactive World Navigation · V1.7
        </small>

    </footer>


    <!-- ข้อความแจ้งเตือนรายการโปรด -->

    <div id="favoriteToast"
         class="favorite-toast"
         role="status"
         aria-live="polite">
    </div>


    <script src="script.js"></script>

</body>
</html>
