
<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HOGWORLDS PATHFINDER</title>

    <!-- WEBSITE DESCRIPTION -->

    <meta name="description"
          content="แผนที่เดินทางของ Danny ที่จะพาคุณไปเรียนได้ถูกทาง">

    <meta property="og:title"
          content="HOGWORLDS PATHFINDER">

    <meta property="og:description"
          content="แผนที่เดินทางของ Danny ที่จะพาคุณไปเรียนได้ถูกทาง">

    <meta property="og:url"
          content="https://dannyfawley.github.io/hogworlds/">

    <meta property="og:type"
          content="website">

    <meta name="theme-color"
          content="#091510">


    <!-- FAVICON -->

    <link rel="icon"
          type="image/png"
          href="./images/logo.png?v=2.0">


    <!-- STYLESHEETS -->

    <link rel="stylesheet"
          href="style.css?v=2.0">

    <link rel="stylesheet"
          href="animation.css?v=1.8.1">

    <link rel="stylesheet"
          href="smart.css?v=2.0.1">

    <link rel="stylesheet"
          href="icons.css?v=2.0.1">


    <style>

        /* =================================
           COMPACT HEADER
        ================================= */

        header {
            text-align: center;
            padding: 24px 20px 6px;
        }

        .crest {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 0 4px;
        }

        .site-logo {
            display: block;
            width: 150px;
            max-width: 45vw;
            height: auto;

            filter: drop-shadow(
                0 0 10px #d4b77d35
            );

            animation:
                logoBreathing
                5s
                ease-in-out
                infinite;

            transition:
                transform 0.4s ease;
        }

        .site-logo:hover {
            transform: scale(1.06);
        }

        @keyframes logoBreathing {

            0%, 100% {

                filter: drop-shadow(
                    0 0 8px #d4b77d25
                );

            }

            50% {

                filter: drop-shadow(
                    0 0 22px #d4b77d65
                );

            }

        }

        header h1 {
            margin: 4px 0 8px;
            line-height: 1.2;
        }

        header .site-tagline {
            font-size: 20px;
            font-weight: 500;
            color: #d4b77d;
            letter-spacing: 0.5px;
            line-height: 1.5;
            margin: 6px 0 0;

            text-shadow:
                0 0 10px #d4b77d25;
        }

        main {
            padding-top: 18px;
        }

        #home > h2 {
            font-size: 24px;
            margin: 0 0 16px;
            line-height: 1.5;
        }

        .category-tabs {
            margin: 12px auto 20px;
        }

        .room-grid {
            margin-top: 16px;
        }


        /* MOBILE RESPONSIVE */

        @media (max-width: 600px) {

            header {
                padding: 18px 12px 4px;
            }

            .site-logo {
                width: 115px;
            }

            header h1 {
                margin: 4px 0 6px;
            }

            header .site-tagline {
                font-size: 16px;
                margin: 4px 0 0;
            }

            main {
                padding-top: 14px;
            }

            #home > h2 {
                font-size: 20px;
                margin-bottom: 12px;
            }

            .category-tabs {
                margin: 10px auto 14px;
            }

            .room-grid {
                margin-top: 12px;
            }

        }

        @media (prefers-reduced-motion: reduce) {

            .site-logo {
                animation: none;
                transition: none;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         WEBSITE HEADER
    ====================================== -->

    <header>

        <div class="crest">

            <img
                src="./images/logo.png?v=2.0"
                alt="Hogworlds Pathfinder Logo"
                class="site-logo">

        </div>

        <h1>HOGWORLDS</h1>

        <p class="site-tagline">

            แผนที่เดินทางของ DANNY

        </p>

    </header>


    <main>


        <!-- =================================
             HOME PAGE
        ================================== -->

        <section id="home">

            <h2>เลือกจุดหมายปลายทาง</h2>


            <!-- QUICK SEARCH -->

            <div
                class="smart-search"
                role="search">

                <svg
                    class="search-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    aria-hidden="true">

                    <circle
                        cx="11"
                        cy="11"
                        r="7">
                    </circle>

                    <path d="m16 16 5 5"></path>

                </svg>

                <input
                    type="search"
                    id="smartSearch"
                    placeholder="ค้นหาห้องเรียน หรือสถานที่..."
                    aria-label="ค้นหาสถานที่"
                    autocomplete="off">

                <button
                    type="button"
                    id="clearSearch"
                    class="smart-clear"
                    aria-label="ล้างคำค้นหา"
                    hidden>

                    ×

                </button>

            </div>


            <!-- RECENTLY VISITED -->

            <section
                id="recentSection"
                class="recent-section"
                hidden>

                <div class="recent-heading">

                    <h3>🕒 เดินทางล่าสุด</h3>

                    <button
                        type="button"
                        id="clearRecent"
                        class="recent-clear">

                        ล้างประวัติ

                    </button>

                </div>

                <div
                    id="recentGrid"
                    class="recent-grid">
                </div>

            </section>


            <!-- CATEGORY TABS -->

            <div class="category-tabs">

                <button
                    type="button"
                    id="classroomTab"
                    class="tab-button active"
                    onclick="selectCategory('classroom')"
                    aria-pressed="true">

                    📖 ห้องเรียน

                    <small>CLASSROOMS</small>

                </button>


                <button
                    type="button"
                    id="locationTab"
                    class="tab-button"
                    onclick="selectCategory('location')"
                    aria-pressed="false">

                    📍 สถานที่ทั่วไป

                    <small>LOCATIONS</small>

                </button>


                <button
                    type="button"
                    id="favoritesTab"
                    class="tab-button"
                    onclick="selectCategory('favorites')"
                    aria-pressed="false">

                    ★ รายการโปรด

                    <small>FAVORITES</small>

                </button>

            </div>


            <!-- SEARCH STATUS -->

            <p
                id="searchStatus"
                role="status"
                aria-live="polite"
                hidden>
            </p>


            <!-- LOCATION CARDS -->

            <div
                class="room-grid"
                id="roomGrid">
            </div>


            <!-- EMPTY SEARCH RESULT -->

            <div
                id="searchEmpty"
                class="search-empty"
                hidden>

                <div class="search-empty-icon">

                    🔍

                </div>

                <h3>ไม่พบสถานที่ที่ค้นหา</h3>

                <p>

                    ลองค้นหาด้วยชื่อภาษาไทย
                    หรือภาษาอังกฤษ

                </p>

            </div>


            <!-- EMPTY FAVORITES -->

            <div
                id="emptyFavorites"
                class="empty-favorites"
                hidden>

                <div class="empty-star">

                    ☆

                </div>

                <h2>ยังไม่มีรายการโปรด</h2>

                <p>

                    กดดาวที่สถานที่ที่คุณเดินทางไปบ่อย
                    เพื่อบันทึกไว้ที่นี่

                </p>

                <button
                    type="button"
                    class="home-button"
                    onclick="selectCategory('classroom')">

                    เลือกสถานที่

                </button>

            </div>

        </section>


        <!-- =================================
             NAVIGATION PAGE
        ================================== -->

        <section id="navigation" hidden>


            <!-- NAVIGATION TOPBAR -->

            <div class="navigation-topbar">

                <button
                    type="button"
                    class="home-button"
                    onclick="goHome()">

                    ← กลับหน้าหลัก

                </button>

                <button
                    type="button"
                    id="shareButton"
                    class="share-button">

                    🔗 คัดลอกลิงก์สถานที่

                </button>

            </div>


            <!-- ROOM NAME AND ICON -->

            <h2 id="roomName"></h2>

            <p id="roomEnglish"></p>


            <!-- PROGRESS -->

            <div class="progress-info">

                <span id="stepCounter"></span>

                <span id="percentage"></span>

            </div>

            <div class="progress-track">

                <div id="progressBar"></div>

            </div>


            <!-- ROUTE IMAGE -->

            <div class="image-frame">

                <img
                    id="routeImage"
                    alt="ภาพเส้นทางจากในเกม">

            </div>

            <p id="instruction"></p>


            <!-- NAVIGATION BUTTONS -->

            <div class="navigation-buttons">

                <button
                    type="button"
                    id="prevButton"
                    onclick="previousStep()">

                    ← ย้อนกลับ

                </button>

                <button
                    type="button"
                    id="nextButton"
                    onclick="nextStep()">

                    เดินทางต่อ →

                </button>

            </div>


            <!-- RESTART ROUTE -->

            <button
                type="button"
                class="restart-button"
                onclick="restartRoute()">

                ↻ เริ่มเส้นทางใหม่

            </button>

        </section>

    </main>


    <!-- =====================================
         LUXURY DANNY SIGNATURE
    ====================================== -->

    <footer class="signature-footer">

        <img
            src="./images/signature1.png"
            alt="Danny Signature"
            class="danny-signature">

    </footer>


    <!-- TOAST NOTIFICATION -->

    <div
        id="favoriteToast"
        class="favorite-toast"
        role="status"
        aria-live="polite">
    </div>


    <!-- =====================================
         JAVASCRIPT
         DO NOT CHANGE LOADING ORDER
    ====================================== -->

    <script src="script.js?v=2.0"></script>

    <script src="animation.js?v=1.8.1"></script>

    <script src="smart.js?v=2.0.1"></script>

    <script src="icons.js?v=2.0.1"></script>


</body>

</html>
