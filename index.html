
<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HOGWORLDS PATHFINDER</title>

    <meta name="description"
          content="แผนที่เดินทางของ Danny ที่จะพาคุณไปเรียนได้ถูกทาง">

    <meta property="og:title"
          content="HOGWORLDS PATHFINDER">

    <meta property="og:description"
          content="แผนที่เดินทางของ Danny ที่จะพาคุณไปเรียนได้ถูกทาง">

    <meta property="og:url"
          content="https://dannyfawley.github.io/hogworlds/">

    <meta property="og:type"
          content="website">


    <!-- CSS หลัก -->

    <link rel="stylesheet"
          href="style.css?v=1.8.2">


    <!-- CSS Animation -->

    <link rel="stylesheet"
          href="animation.css?v=1.8.2">

</head>


<body>

    <header>

        <div class="crest">✦</div>

        <h1>HOGWORLDS</h1>

        <div class="subtitle">
            P A T H F I N D E R
        </div>

        <p>แผนที่เดินทางของ DANNY</p>

    </header>


    <main>

        <!-- หน้าหลัก -->

        <section id="home">

            <h2>เลือกจุดหมายปลายทาง</h2>

            <p class="description">
                เลือกสถานที่ที่คุณต้องการเดินทางไป
            </p>


            <!-- TAB ทั้ง 3 หมวด -->

            <div class="category-tabs">

                <button
                    id="classroomTab"
                    class="tab-button active"
                    onclick="selectCategory('classroom')"
                    aria-pressed="true">

                    📖 ห้องเรียน
                    <small>CLASSROOMS</small>

                </button>


                <button
                    id="locationTab"
                    class="tab-button"
                    onclick="selectCategory('location')"
                    aria-pressed="false">

                    📍 สถานที่ทั่วไป
                    <small>LOCATIONS</small>

                </button>


                <button
                    id="favoritesTab"
                    class="tab-button"
                    onclick="selectCategory('favorites')"
                    aria-pressed="false">

                    ★ รายการโปรด
                    <small>FAVORITES</small>

                </button>

            </div>


            <!-- การ์ดสถานที่ -->

            <div class="room-grid" id="roomGrid">
            </div>


            <!-- เมื่อยังไม่มีรายการโปรด -->

            <div id="emptyFavorites"
                 class="empty-favorites"
                 hidden>

                <div class="empty-star">☆</div>

                <h2>ยังไม่มีรายการโปรด</h2>

                <p>
                    กดดาวที่สถานที่ที่คุณเดินทางไปบ่อย
                    เพื่อบันทึกไว้ที่นี่
                </p>

                <button
                    class="home-button"
                    onclick="selectCategory('classroom')">

                    เลือกสถานที่

                </button>

            </div>

        </section>


        <!-- หน้านำทาง -->

        <section id="navigation" hidden>

            <button
                class="home-button"
                onclick="goHome()">

                ← กลับหน้าหลัก

            </button>


            <h2 id="roomName"></h2>

            <p id="roomEnglish"></p>


            <!-- ความคืบหน้า -->

            <div class="progress-info">

                <span id="stepCounter"></span>

                <span id="percentage"></span>

            </div>


            <div class="progress-track">

                <div id="progressBar"></div>

            </div>


            <!-- ภาพนำทางพร้อม Animation -->

            <div class="image-frame">

                <img
                    id="routeImage"
                    alt="ภาพเส้นทางจากในเกม">

            </div>


            <p id="instruction"></p>


            <!-- ปุ่มควบคุม -->

            <div class="navigation-buttons">

                <button
                    id="prevButton"
                    onclick="previousStep()">

                    ← ย้อนกลับ

                </button>


                <button
                    id="nextButton"
                    onclick="nextStep()">

                    เดินทางต่อ →

                </button>

            </div>


            <button
                class="restart-button"
                onclick="restartRoute()">

                ↻ เริ่มเส้นทางใหม่

            </button>

        </section>

    </main>

<footer class="signature-footer">

    <img
        src="./images/signature1.png"
        alt="Danny Signature"
        class="danny-signature">

</footer>


    <!-- แจ้งเตือนรายการโปรด -->

    <div
        id="favoriteToast"
        class="favorite-toast"
        role="status"
        aria-live="polite">

    </div>


    <!-- JavaScript หลัก -->

    <script src="script.js?v=1.8.1"></script>


    <!-- JavaScript Animation -->

    <script src="animation.js?v=1.8.1"></script>

</body>

</html>
